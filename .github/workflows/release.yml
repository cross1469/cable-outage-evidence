name: release

on:
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller
      - run: python -m unittest discover -s tests -t .
      - name: Build
        id: build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build-windows.ps1 python
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum dist/cable-outage-evidence.exe | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" \
            --notes "Windows 版：解壓縮後雙擊 cable-outage-evidence.exe。第一次執行會詢問數據機帳密（直接按 Enter 使用原廠預設）。

          exe SHA256: \`$sha\`"
